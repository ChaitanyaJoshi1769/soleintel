version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: soleintel-postgres
    environment:
      POSTGRES_USER: soleintel
      POSTGRES_PASSWORD: dev-password
      POSTGRES_DB: soleintel
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soleintel']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soleintel-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: soleintel-api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://soleintel:dev-password@postgres:5432/soleintel
      REDIS_URL: redis://redis:6379
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/src
    command: npm run dev

  scraper:
    build:
      context: .
      dockerfile: ./packages/scrapers/Dockerfile
    container_name: soleintel-scraper
    environment:
      NODE_ENV: development
      API_URL: http://api:3000
    depends_on:
      - api
    volumes:
      - ./packages/scrapers/src:/app/src

volumes:
  postgres-data:
